# Render Blueprint for the API. The SQLite database lives on a persistent disk, so it survives deploys and restarts.
# A disk needs a paid instance and allows only one instance; move to Postgres before scaling out.
services:
  - type: web
    name: english-coach-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DB_PATH
        value: /var/data/data.db
      # Filled in on Render's dashboard (values from apps/api/.env), never committed.
      - { key: OPENAI_API_KEY, sync: false }
      - { key: OPENAI_MODEL, sync: false }
      - { key: OPENAI_STT_MODEL, sync: false }
      - { key: AZURE_SPEECH_KEY, sync: false }
      - { key: AZURE_SPEECH_REGION, sync: false }
      - { key: AZURE_TTS_VOICE, sync: false }
      - { key: AZURE_TTS_RATE, sync: false }
      - { key: AZURE_TTS_VOICE_HINDI, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SECRET_KEY, sync: false }
      - { key: SUPABASE_JWT_SECRET, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: WEB_ORIGIN, sync: false }
      - { key: PLIVO_AUTH_ID, sync: false }
      - { key: PLIVO_AUTH_TOKEN, sync: false }
